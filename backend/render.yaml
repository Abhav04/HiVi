# Render Blueprint — optional; you can also configure manually in the dashboard.
services:
  - type: web
    name: hivi-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_FRONTEND_URL
        value: https://hi-vi.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hivi-db
          property: connectionString

databases:
  - name: hivi-db
    plan: free
    databaseName: editorplatform
    user: hivi
