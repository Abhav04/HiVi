# Local development — run: export SPRING_PROFILES_ACTIVE=local && ./mvnw spring-boot:run
# Or: ./run-local.sh (loads backend/local.env if present)

community.demo.seed=true

spring.datasource.url=jdbc:postgresql://localhost:5432/editorplatform
spring.datasource.username=abhavkushwaha
spring.datasource.password=postgres123

# OAuth + DB secrets (gitignored). Copy local.env.example → local.env
spring.config.import=optional:file:./local.env[.properties]

# No Redis required locally
spring.cache.type=simple
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.data.redis.repositories.enabled=false

app.frontend.url=http://localhost:3000
app.base.url=http://localhost:8080
spring.security.oauth2.client.registration.google.redirect-uri=${app.base.url}/login/oauth2/code/google
spring.security.oauth2.client.registration.github.redirect-uri=${app.base.url}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

server.servlet.session.timeout=15m
server.servlet.session.cookie.same-site=lax
