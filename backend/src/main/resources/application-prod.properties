# Production profile (Render)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Disable Redis unless you add a Render Redis instance
spring.cache.type=simple
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# DATABASE_URL is converted to JDBC by RenderDatabaseEnvironmentPostProcessor.
# Or set SPRING_DATASOURCE_URL / USERNAME / PASSWORD manually in Render env.

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
