# Production profile (Render)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Trust Render's proxy so OAuth redirect URIs use the public HTTPS URL
server.forward-headers-strategy=native

# Render injects RENDER_EXTERNAL_URL; fallback matches your service URL
app.base.url=${RENDER_EXTERNAL_URL:https://hivi-idam.onrender.com}
spring.security.oauth2.client.registration.google.redirect-uri=${app.base.url}/login/oauth2/code/google
spring.security.oauth2.client.registration.github.redirect-uri=${app.base.url}/login/oauth2/code/github

# Disable Redis (use in-memory cache)
spring.cache.type=simple
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.data.redis.repositories.enabled=false

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
