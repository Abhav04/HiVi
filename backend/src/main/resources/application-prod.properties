# Production profile (Render)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN
logging.level.com.oauth.demo=INFO
logging.level.com.oauth.demo.reddit=INFO

# Bind to all interfaces on Render's PORT
server.address=0.0.0.0

# Trust Render's proxy so OAuth redirect URIs use the public HTTPS URL
server.forward-headers-strategy=native

# Keep OAuth state in session long enough to complete GitHub/Google redirect
server.servlet.session.timeout=15m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Create/update schema when new entities ship (community, opportunities, etc.)
# Use validate only after all tables exist and you add Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.main.lazy-initialization=true

# Render injects RENDER_EXTERNAL_URL; fallback matches your service URL
app.base.url=${RENDER_EXTERNAL_URL:https://hivi-idam.onrender.com}
app.frontend.url=${APP_FRONTEND_URL:https://hi-vi.vercel.app}
spring.security.oauth2.client.registration.google.redirect-uri=${app.base.url}/login/oauth2/code/google
spring.security.oauth2.client.registration.github.redirect-uri=${app.base.url}/login/oauth2/code/github

# GitHub token endpoint expects client_id/client_secret in POST body (not only Basic auth)
spring.security.oauth2.client.registration.github.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_post

# Static OAuth provider URLs (avoids slow OIDC discovery fetch at startup)
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# Actuator health for Render port/health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Disable Redis and unused auto-config
spring.cache.type=simple
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

spring.data.redis.repositories.enabled=false
spring.jmx.enabled=false

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
