spring.application.name=demo

# Render sets PORT at runtime
server.port=${PORT:8080}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.base.url=${APP_BASE_URL:http://localhost:8080}

spring.security.user.name=user
spring.security.user.password=password
spring.app.jwtSecret=${JWT_SECRET:ThisIsAVeryStrongJwtSecretKeyForSpringBootProject123456}
spring.app.jwtExpirationMs=86400000

# OAuth (override in Render env vars)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:YOUR_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:YOUR_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${app.base.url}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-authentication-method=client_secret_post

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.base.url}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_post

# Datasource is created by DatabaseConfig from DATABASE_URL / DB_* env vars.
# Local dev: activate profile "local" (see application-local.properties)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (disabled in prod profile)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Reddit trending feed (public JSON API — cached, refreshed on schedule)
reddit.base-url=https://www.reddit.com
reddit.user-agent=HiVi/1.0 (Spring Boot; +https://hi-vi.vercel.app)
reddit.subreddits=VideoEditors,VideoEditor_forhire,FreelanceIndia,forhire,videoediting,AfterEffects,premiere,Filmmakers,videography
reddit.posts-per-subreddit=15
reddit.refresh-interval-ms=300000
reddit.request-delay-ms=1100

# Opportunities — curated career hub (Reddit JSON + static partner links)
opportunities.enabled=true
opportunities.refresh-interval-ms=900000
opportunities.feed-page-size=20
opportunities.reddit-hiring-subreddits=VideoEditor_forhire,forhire,FreelanceIndia,hireaneditor,VideoEditors,videoediting
reddit.connect-timeout-ms=5000
reddit.read-timeout-ms=10000

# Community platform media (local dev; use S3/R2 in production)
community.media.upload-dir=uploads/community
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=200MB

# Mail (local dev)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

logging.level.org.hibernate.SQL=DEBUG
